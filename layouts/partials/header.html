<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ "/" | relURL }}">{{ partial "logo.html" . }}<span>Shipward</span></a>
    <nav class="topnav" aria-label="Shipward">
      <a href="{{ "/#what" | relURL }}">What it does</a>
      <a href="{{ "/#how" | relURL }}">How it works</a>
      <a href="{{ "/docs/" | relURL }}"{{ if eq .Section "docs" }} aria-current="page"{{ end }}>Docs</a>
      {{- /* The toggle needs JavaScript; without it the site follows the system theme and the button stays hidden. */}}
      <button class="theme-toggle" type="button" data-theme-toggle hidden aria-label="Switch between light and dark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.41-1.41M4.93 19.07l1.41-1.41m0-11.32L4.93 4.93m14.14 14.14-1.41-1.41M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/><path class="moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </nav>
  </div>
</header>
